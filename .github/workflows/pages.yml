name: website
on:
  push:
    branches: [main]
    paths: ["website/**", "docs/**", "images/**", "benchmark/README.md", "CHANGELOG.md", "scripts/build_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

# Builds the site and publishes it both ways GitHub Pages can be configured
# (Settings -> Pages -> Source), so either choice works:
#   "Deploy from a branch" -> gh-pages / (root)   : served from the branch pushed below
#   "GitHub Actions"                              : served from the artifact deployed below
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - run: python scripts/build_site.py
      - name: Publish _site to the gh-pages branch
        run: |
          cp -r _site /tmp/site && cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish website from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:   # only succeeds when Pages' source is "GitHub Actions"; harmless otherwise
    needs: publish
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
