name: website
on:
  push:
    branches: [main]
    paths: ["website/**", "docs/**", "images/**", "benchmark/README.md", "CHANGELOG.md", "scripts/build_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

# Builds the site and publishes it to the gh-pages branch.
# One-time setup: Settings -> Pages -> Source "Deploy from a branch" -> Branch "gh-pages", folder "/ (root)" -> Save.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - run: python scripts/build_site.py
      - name: Publish _site to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish website from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
