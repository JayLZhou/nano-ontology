# Procurement ontology: what exists (objects, links) and what may happen (actions).
name: procurement
version: 0.1.0

roles:
  employee:     {label: Employee}
  dept_manager: {label: Department manager}
  cfo:          {label: CFO}

object_types:
  Supplier:
    label: Supplier
    primary_key: supplier_id
    properties:
      supplier_id: {type: string, required: true}
      name:        {type: string, required: true, label: Name}
      rating:      {type: string, enum: [A, B, C], label: Rating}
      blacklisted: {type: boolean, default: false, label: Blacklisted}
      # property-level permission: every other role sees "***"
      bank_account: {type: string, label: Bank account, readable_by: [cfo]}

  PurchaseOrder:
    label: Purchase order
    primary_key: po_id
    id_prefix: PO-
    # row-level permission: employees only see their own orders
    visible_when: obj.requester == actor.id or actor.role != 'employee'
    properties:
      po_id:     {type: string, required: true}
      title:     {type: string, required: true, label: Title}
      amount:    {type: number, required: true, label: Amount}
      status:    {type: string, enum: [approved, paid, cancelled], default: approved, label: Status}
      requester: {type: string, label: Requester}

link_types:
  supplier:
    from: PurchaseOrder
    to: Supplier
    cardinality: many_to_one
    label: Supplier

action_types:
  submit_purchase_order:
    label: Submit a purchase order
    description: Create a purchase order. Larger amounts are held for approval and only created once approved.
    allowed_roles: [employee, dept_manager, cfo]
    parameters:
      title:    {type: string, description: What is being bought}
      amount:   {type: number, description: Total amount}
      supplier: {type: object_ref, object_type: Supplier}
    rules:
      - id: no_blacklisted_supplier
        when: params.supplier.blacklisted
        then: deny
        message: Blacklisted suppliers cannot be used
      - id: positive_amount
        when: params.amount <= 0
        then: deny
        message: The amount must be greater than zero
      - id: dept_manager_over_10k
        when: params.amount > 10000
        then: {require_approval: dept_manager}
        message: Order exceeds 10,000
        source: {doc: procurement-policy.md, quote: "A single purchase above 10,000 requires approval by the department manager."}
      - id: cfo_over_50k
        when: params.amount > 50000
        then: {require_approval: cfo}
        message: Order exceeds 50,000
        source: {doc: procurement-policy.md, quote: "A single purchase above 50,000 requires approval by the CFO."}
      - id: warn_rating_c
        when: params.supplier.rating == 'C'
        then: warn
        message: This supplier is rated C; expect delivery risk
    effects:
      - create: PurchaseOrder
        as: po
        set:
          title: params.title
          amount: params.amount
          requester: actor.id
          status: "'approved'"
      - link: supplier
        from: po
        to: params.supplier

  cancel_purchase_order:
    label: Cancel a purchase order
    allowed_roles: [employee, dept_manager, cfo]
    parameters:
      po: {type: object_ref, object_type: PurchaseOrder}
    rules:
      - id: only_unpaid
        when: params.po.status != 'approved'
        then: deny
        message: Only approved, unpaid orders can be cancelled
      - id: only_own_or_cfo
        when: params.po.requester != actor.id and actor.role != 'cfo'
        then: deny
        message: You can only cancel your own orders (the CFO can cancel any)
    effects:
      - update: params.po
        set: {status: "'cancelled'"}

  blacklist_supplier:
    label: Blacklist a supplier
    allowed_roles: [cfo]
    parameters:
      supplier: {type: object_ref, object_type: Supplier}
    effects:
      - update: params.supplier
        set: {blacklisted: true}
